<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Egg">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>Egg</title>
<!--
  Egg app v0.2 (2026-11-14) — v0.2 adds the Goals tab. Stephan's library. Static page on GitHub Pages.
  Private key comes in the link (?k=...) and is kept in localStorage. Nothing personal lives in this file:
  data/*.bin are AES-256-GCM encrypted (12-byte nonce + ciphertext of gzip JSON), built by scripts/build_app.py.
-->
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1c1b19;--sub:#6b675f;--line:#e7e2d8;--acc:#c8871e;--acc2:#2f6f4f;--chip:#f1ece2;--blue:#2a5d9f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--card:#1f1d1a;--ink:#eeeae2;--sub:#a29d92;--line:#33302b;--acc:#e0a040;--acc2:#5fb88a;--chip:#2a2723;--blue:#7fa8e0}}
:root[data-theme="dark"]{--bg:#151412;--card:#1f1d1a;--ink:#eeeae2;--sub:#a29d92;--line:#33302b;--acc:#e0a040;--acc2:#5fb88a;--chip:#2a2723;--blue:#7fa8e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 small{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
.search{width:100%;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search:focus{border-color:var(--acc)}
.bar{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);font-size:13px;padding:5px 9px;border-radius:7px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.count{font-size:12px;color:var(--sub);margin-left:auto}
main{padding:8px 16px}
.grp{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.row{display:flex;gap:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:inherit}
.cov{flex:0 0 46px;height:68px;border-radius:4px;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--acc)}
.cov img{width:100%;height:100%;object-fit:cover}
.meta{min-width:0;flex:1}
.t{font-weight:600;line-height:1.25}
.a{font-size:14px;color:var(--sub)}
.o{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--sub)}
.chip.g{color:var(--acc2)}.chip.b{color:var(--blue)}
mark{background:rgba(200,135,30,.25);color:inherit;border-radius:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 1px 6px;font-size:10.5px;color:var(--sub);text-decoration:none}
nav a b{display:block;font-size:20px;line-height:1.2}
nav a.on{color:var(--acc)}
.item{padding:4px 0 24px}
.back{display:inline-block;margin:4px 0 8px;color:var(--acc);text-decoration:none;font-size:16px}
.hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.hero .cov{flex-basis:84px;height:124px;font-size:32px}
.md h1{font-size:22px;display:block;margin:0 0 6px}.md h2{font-size:18px;margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.md h3{font-size:16px;margin:14px 0 4px}.md p{margin:6px 0}.md ul,.md ol{margin:4px 0;padding-left:22px}.md li{margin:3px 0}
.md a{color:var(--blue)}.md em{color:var(--sub)}
.md ul ul{padding-left:18px}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{font-weight:600}
.empty{color:var(--sub);text-align:center;padding:40px 10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;text-decoration:none;display:inline-block}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.res .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.src{font-size:12px;color:var(--sub);margin:4px 0}
.note{font-size:13px;color:var(--sub);margin:8px 0}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<header id="hdr">
  <h1>🥚 Egg <small id="built"></small></h1>
  <input id="q" class="search" type="search" placeholder="Search title, author, principle…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div class="bar" id="ctl">
    <div class="seg" id="sort"><button data-v="title" class="on">Title</button><button data-v="author">Author</button><button data-v="added">Added</button></div>
    <div class="seg" id="group"><button data-v="cat" class="on">By category</button><button data-v="none">All</button></div>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="main"><div class="empty">Opening…</div></main>
<nav id="nav">
  <a href="#/" data-t="books" class="on"><b>📚</b>Books</a>
  <a href="#/find" data-t="find"><b>🔎</b>Find Books</a>
  <a href="#/make" data-t="make"><b>✍️</b>Make</a>
  <a href="#/media" data-t="media"><b>🎧</b>Videos</a>
  <a href="#/goals" data-t="goals"><b>🎯</b>Goals</a>
</nav>
<script>
"use strict";
var T0 = performance.now();
var $ = function (s) { return document.querySelector(s); };
var KEYSTR = new URLSearchParams(location.search).get('k') || store('eggKey') || '';
if (new URLSearchParams(location.search).get('k')) { store('eggKey', KEYSTR); history.replaceState(null, '', location.pathname + location.hash); }
var CK; // CryptoKey
var DB = { items: [], built: '' };
var S = { sort: store('eggSort') || 'title', group: store('eggGroup') || 'cat', q: '' };
var CACHE = 'egg-data-v1';

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

async function getKey() { if (!CK) CK = await crypto.subtle.importKey('raw', b64u(KEYSTR), 'AES-GCM', false, ['decrypt']); return CK; }
async function unseal(buf) {
  var k = await getKey(), u = new Uint8Array(buf);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, k, u.slice(12));
  var ds = new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip')));
  return JSON.parse(await ds.text());
}
// cache-first, then refresh from network in the background (onFresh called if the bytes changed)
async function getBin(path, onFresh) {
  var c = ('caches' in window) ? await caches.open(CACHE) : null;
  var hit = c ? await c.match(path) : null;
  var net = fetch(path + '?t=' + Date.now(), { cache: 'no-store' }).then(async function (r) {
    if (!r.ok) throw new Error(r.status);
    var buf = await r.clone().arrayBuffer();
    if (c) await c.put(path, r);
    return buf;
  });
  if (hit) {
    var old = await hit.arrayBuffer();
    if (onFresh) net.then(function (buf) { if (!same(old, buf)) onFresh(buf); }).catch(function () {});
    return old;
  }
  return net;
}
function same(a, b) { if (a.byteLength !== b.byteLength) return false; var x = new Uint8Array(a), y = new Uint8Array(b); for (var i = 0; i < 12; i++) if (x[i] !== y[i]) return false; return true; }

// ---------- markdown (headings, lists, bold, italics, links, [[Egg links]]) ----------
function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[(EGG-\d{4})([^\]]*)\]\]/g, function (m, id, rest) { return '<a href="#/b/' + id + (/POE 2021 notes/.test(rest) ? '/poe' : '') + '">' + id + rest + '</a>'; });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])_(.+?)_(?=[\s).,;:]|$)/g, '$1<em>$2</em>');
  s = s.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src) {
  var out = [], stack = [];
  function closeTo(d) { while (stack.length > d) out.push('</' + stack.pop() + '>'); }
  src.split('\n').forEach(function (line) {
    var m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeTo(0); var n = m[1].length; out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); return; }
    if ((m = line.match(/^(\s*)(-|\d+\.)\s+(.*)/))) {
      var depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2) + 1, tag = m[2] === '-' ? 'ul' : 'ol';
      closeTo(depth);
      while (stack.length < depth) { out.push('<' + tag + '>'); stack.push(tag); }
      var txt = m[3].replace(/^\[ \]\s*/, '☐ ').replace(/^\[x\]\s*/i, '☑ ');
      out.push('<li>' + inline(txt) + '</li>'); return;
    }
    closeTo(0);
    if (line.trim()) out.push('<p>' + inline(line) + '</p>');
  });
  closeTo(0);
  return out.join('');
}

// ---------- Books ----------
function initials(t) { return esc((t.replace(/^(The|A|An)\s+/i, '')[0] || '?').toUpperCase()); }
function cov(it) { return '<div class="cov">' + (it.cover ? '<img loading="lazy" decoding="async" alt="" src="' + esc(it.cover) + '" onerror="this.remove()">' : '') + (it.cover ? '' : initials(it.title)) + '</div>'; }
function sortKey(it) { return S.sort === 'author' ? (it.author.split(' ').slice(-1)[0] + ' ' + it.author + ' ' + it.title).toLowerCase() : S.sort === 'added' ? it.added + it.id : it.title.replace(/^(The|A|An)\s+/i, '').toLowerCase(); }
function hl(s, terms) { s = esc(s); terms.forEach(function (t) { if (t.length > 1) s = s.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); return s; }
function renderBooks() {
  var terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  var list = DB.items.filter(function (it) {
    if (!terms.length) return true;
    var hay = it._h || (it._h = (it.title + ' ' + it.author + ' ' + it.cat + ' ' + it.tags + ' ' + it.one + ' ' + it.kp + ' ' + it.s).toLowerCase());
    return terms.every(function (t) { return hay.indexOf(t) >= 0; });
  });
  list.sort(function (a, b) { var x = sortKey(a), y = sortKey(b); return S.sort === 'added' ? (x < y ? 1 : -1) : (x < y ? -1 : x > y ? 1 : 0); });
  $('#count').textContent = list.length + ' of ' + DB.items.length;
  if (!list.length) { $('#main').innerHTML = '<div class="empty">Nothing in Egg matches “' + esc(S.q) + '”.<br><br><a class="btn p" href="#/find?q=' + encodeURIComponent(S.q) + '">Find it in free sources</a></div>'; return; }
  var groups = {};
  list.slice(0, 600).forEach(function (it) { var g = S.group === 'cat' ? it.cat || 'Other' : ''; (groups[g] = groups[g] || []).push(it); });
  var html = '';
  Object.keys(groups).sort().forEach(function (g) {
    if (g) html += '<div class="grp">' + esc(g) + ' · ' + groups[g].length + '</div>';
    groups[g].forEach(function (it) {
      html += '<a class="row" href="#/b/' + it.id + '">' + cov(it) + '<div class="meta"><div class="t">' + hl(it.title, terms) + '</div><div class="a">' + hl(it.author, terms) + '</div><div class="o">' + hl(it.one, terms) + '</div><div class="chips">' +
        (it.full ? '<span class="chip g">full text</span>' : '<span class="chip">notes only</span>') + '<span class="chip">' + esc(it.status) + '</span>' + (it.tags.indexOf('POE 2021') >= 0 ? '<span class="chip b">2021 notes</span>' : '') + '</div></div></a>';
    });
  });
  if (list.length > 600) html += '<div class="note">Showing 600 of ' + list.length + ' — type more to narrow.</div>';
  $('#main').innerHTML = html;
}

async function renderItem(id, poe) {
  var it = DB.items.find(function (x) { return x.id === id; });
  if (!it) { $('#main').innerHTML = '<div class="empty">No item ' + esc(id) + '</div>'; return; }
  $('#main').innerHTML = '<div class="item"><a class="back" href="#/">‹ Books</a><div class="hero">' + cov(it) + '<div><div class="t" style="font-size:20px">' + esc(it.title) + '</div><div class="a">' + esc(it.author) + '</div><div class="o" style="-webkit-line-clamp:unset">' + esc(it.one) + '</div>' +
    (it.link ? '<div style="margin-top:8px"><a class="btn" target="_blank" rel="noopener" href="' + esc(it.link) + '">Source</a></div>' : '') + '</div></div><div class="md" id="md"><p class="note">Loading notes…</p></div></div>';
  window.scrollTo(0, 0);
  try {
    var d = await unseal(await getBin('data/items/' + id + '.bin'));
    var body = d.md.replace(/^# .*\n/, '');
    var html = md(body);
    if (d.poe) html += '<details' + (poe ? ' open' : '') + ' id="poe"><summary>Stephan’s 2021 notes (POE Data)</summary><div class="md">' + md(d.poe.replace(/^# .*\n/, '')) + '</div></details>';
    $('#md').innerHTML = html;
    if (poe) $('#poe').scrollIntoView();
  } catch (e) { $('#md').innerHTML = '<p class="note">Couldn’t open the notes (' + esc(e.message) + '). Offline and not opened before?</p>'; }
}

// ---------- Find Books (free sources, searched from the phone) ----------
var FIND = {
  gutenberg: function (q) { return fetch('https://gutendex.com/books/?search=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
    return d.results.filter(function (b) { return !b.copyright; }).slice(0, 8).map(function (b) { return { title: b.title, author: (b.authors[0] || {}).name || '', year: '', src: 'Gutenberg', free: true, url: 'https://www.gutenberg.org/ebooks/' + b.id }; }); }); },
  openlibrary: function (q) { return fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q) + '&limit=12&fields=key,title,author_name,first_publish_year,ebook_access,ia,cover_i').then(function (r) { return r.json(); }).then(function (d) {
    return d.docs.map(function (b) { return { title: b.title, author: (b.author_name || [''])[0], year: b.first_publish_year || '', src: 'Open Library', free: b.ebook_access === 'public', url: 'https://openlibrary.org' + b.key, cover: b.cover_i ? 'https://covers.openlibrary.org/b/id/' + b.cover_i + '-S.jpg' : '' }; }); }); },
  google: function (q) { return fetch('https://www.googleapis.com/books/v1/volumes?filter=free-ebooks&maxResults=10&q=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
    return (d.items || []).filter(function (v) { return v.accessInfo && v.accessInfo.accessViewStatus === 'FULL_PUBLIC_DOMAIN'; }).map(function (v) { var i = v.volumeInfo; return { title: i.title, author: (i.authors || [''])[0], year: (i.publishedDate || '').slice(0, 4), src: 'Google Books', free: true, url: i.infoLink }; }); }); },
  archive: function (q) { return fetch('https://archive.org/advancedsearch.php?q=' + encodeURIComponent('(' + q + ') AND mediatype:texts AND NOT collection:inlibrary AND NOT collection:printdisabled AND NOT access-restricted-item:true AND date:[* TO 1930-12-31]') + '&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=date&rows=8&output=json').then(function (r) { return r.json(); }).then(function (d) {
    return d.response.docs.map(function (b) { return { title: b.title, author: [].concat(b.creator || '')[0], year: (b.date || '').slice(0, 4), src: 'Internet Archive', free: true, url: 'https://archive.org/details/' + b.identifier }; }); }); },
  wikisource: function (q) { return fetch('https://en.wikisource.org/w/api.php?action=query&list=search&srnamespace=0&srlimit=6&format=json&origin=*&srsearch=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
    return d.query.search.filter(function (p) { return p.title.indexOf('/') < 0; }).map(function (p) { return { title: p.title, author: '', year: '', src: 'Wikisource', free: true, url: 'https://en.wikisource.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')) }; }); }); }
};
function nk(s) { return String(s || '').toLowerCase().replace(/^(the|a|an)\s+/, '').replace(/[:;(].*$/, '').replace(/[^a-z0-9]/g, ''); }
function wanted() { try { return JSON.parse(store('eggWanted') || '[]'); } catch (e) { return []; } }
function renderFind(q0) {
  var w = wanted();
  $('#main').innerHTML = '<p class="note">Searches Gutenberg, Open Library, Google Books (public domain), Internet Archive (public-domain only — never its lending books) and Wikisource. 🟢 = free full text. Not free → buy DRM-free or borrow.</p>' +
    '<div id="fr"></div><div class="grp">Wanted list · ' + w.length + '</div>' +
    (w.length ? w.map(function (x, i) { return '<div class="res"><div class="t">' + esc(x.title) + '</div><div class="src">' + esc(x.author) + ' · ' + esc(x.src) + '</div><div class="links"><a class="btn" target="_blank" href="' + esc(x.url) + '">Open</a><button class="btn" data-del="' + i + '">Remove</button></div></div>'; }).join('') +
      '<button class="btn p" id="copyw">Copy list for Egg</button><p class="note">For now: paste this into Jarvis or tell Egg “sync” with it — Egg on the Mac downloads, stores and breaks each one down. Adding straight from the phone comes next.</p>' : '<p class="note">Tap “Want” on a result to queue it for Egg.</p>');
  document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { var w = wanted(); w.splice(+b.dataset.del, 1); store('eggWanted', JSON.stringify(w)); renderFind(S.q); }; });
  var cw = $('#copyw'); if (cw) cw.onclick = function () { navigator.clipboard.writeText('Egg — add these:\n' + wanted().map(function (x) { return '- ' + x.title + ' — ' + x.author + ' (' + x.src + ': ' + x.url + ')'; }).join('\n')).then(function () { cw.textContent = 'Copied ✓'; }); };
  if (q0 && q0.trim().length > 1) runFind(q0.trim());
}
var findSeq = 0;
function runFind(q) {
  var seq = ++findSeq, res = [], done = 0, names = Object.keys(FIND);
  var have = {}; DB.items.forEach(function (it) { have[nk(it.title)] = it.id; });
  var box = $('#fr'); box.innerHTML = '<p class="note">Searching “' + esc(q) + '”…</p>';
  function draw() {
    if (seq !== findSeq) return;
    var merged = {};
    res.forEach(function (r) { var k = nk(r.title) + '|' + nk((r.author || '').split(',')[0].split(' ').slice(-1)[0]); var m = merged[k] || (merged[k] = { title: r.title, author: r.author, year: r.year, srcs: [], free: false, cover: '' }); m.srcs.push(r); m.free = m.free || r.free; m.cover = m.cover || r.cover; if (!m.author) m.author = r.author; });
    var list = Object.values(merged).sort(function (a, b) { return (b.free - a.free) || (b.srcs.length - a.srcs.length); }).slice(0, 30);
    var html = '<p class="note">' + done + '/' + names.length + ' sources answered · ' + list.length + ' books</p>';
    list.forEach(function (m, i) {
      var inEgg = have[nk(m.title)], qq = encodeURIComponent(m.title + ' ' + (m.author || ''));
      html += '<div class="res"><div class="t">' + (m.free ? '🟢 ' : '⚪ ') + esc(m.title) + '</div><div class="src">' + esc(m.author || '') + (m.year ? ' · ' + esc(m.year) : '') + '</div><div class="src">' +
        m.srcs.map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.src) + (s.free ? '' : ' (not free)') + '</a>'; }).join(' · ') + '</div><div class="links">' +
        (inEgg ? '<a class="btn p" href="#/b/' + inEgg + '">In Egg ✓</a>' : (m.free ? '<button class="btn p" data-want="' + i + '">Want</button>' : '<button class="btn" data-want="' + i + '">Want (notes)</button>')) +
        (m.free ? '' : '<a class="btn" target="_blank" href="https://libro.fm/search?q=' + qq + '">🔵 Libro.fm</a><a class="btn" target="_blank" href="https://www.kobo.com/us/en/search?query=' + qq + '">🔵 Kobo</a><a class="btn" target="_blank" href="https://www.overdrive.com/search?q=' + qq + '">🟡 Libby</a>') + '</div></div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('[data-want]').forEach(function (b) { b.onclick = function () { var m = list[+b.dataset.want], s = m.srcs.find(function (x) { return x.free; }) || m.srcs[0]; var w = wanted(); w.push({ title: m.title, author: m.author || '', src: s.src, url: s.url, free: m.free, at: new Date().toISOString() }); store('eggWanted', JSON.stringify(w)); renderFind(S.q); }; });
  }
  names.forEach(function (n) {
    var t = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 8000); });
    Promise.race([FIND[n](q), t]).then(function (r) { res = res.concat(r); }).catch(function () {}).then(function () { done++; draw(); });
  });
}

function renderMedia() {
  var v = DB.items.filter(function (it) { return it.type === 'Video' || it.type === 'Podcast'; });
  $('#main').innerHTML = (v.length ? v.map(function (it) { return '<a class="row" href="#/b/' + it.id + '">' + cov(it) + '<div class="meta"><div class="t">' + esc(it.title) + '</div><div class="a">' + esc(it.author) + '</div><div class="o">' + esc(it.one) + '</div></div></a>'; }).join('') : '<div class="empty">No videos or podcasts yet.</div>') +
    '<div class="grp">Add a link</div><textarea id="lk" placeholder="Paste a YouTube or podcast link, plus what to pull out (e.g. “the business advice”)"></textarea><div style="margin-top:8px"><button class="btn p" id="lkadd">Add to Wanted list</button></div><p class="note">The link tool (captions/Whisper → breakdown) runs on the Mac; for now links go on the Wanted list in Find Books. No Instagram.</p>';
  $('#lkadd').onclick = function () { var t = $('#lk').value.trim(); if (!t) return; var url = (t.match(/https?:\/\/\S+/) || [''])[0]; var w = wanted(); w.push({ title: t.replace(url, '').trim() || url, author: '', src: 'Link', url: url, at: new Date().toISOString() }); store('eggWanted', JSON.stringify(w)); $('#lk').value = ''; location.hash = '#/find'; };
}

// ---------- Goals (from Jarvis Goals.md + workshop handoffs + library; built by build_goals.py) ----------
var GOALS = null;
function ticks() { try { return JSON.parse(store('eggTicks') || '{}'); } catch (e) { return {}; } }
function stepKey(g, s) { return g.id + '|' + s.text; }
function isDone(g, s, t) { var k = stepKey(g, s); return k in t ? t[k] : s.done; }
function dueInfo(g) {
  if (!g.due) return { txt: g.deadline || '', red: false };
  var days = Math.round((new Date(g.due + 'T23:59:00') - new Date()) / 864e5);
  return { txt: (days < 0 ? 'OVERDUE ' + (-days) + 'd' : days === 0 ? 'due today' : 'in ' + days + 'd') + ' · ' + g.deadline, red: days <= 7 };
}
async function loadGoals(after) {
  if (GOALS) return after();
  try {
    GOALS = await unseal(await getBin('data/goals.bin', async function (fresh) { GOALS = await unseal(fresh); route(); }));
  } catch (e) { $('#main').innerHTML = '<div class="empty">Goals not built yet (' + esc(e.message) + ').</div>'; return; }
  after();
}
function staleLine() { return GOALS.stale ? '<p class="note" style="color:var(--acc)">⚠️ Goals may be stale (' + esc(GOALS.stale_because) + ') — tell Jarvis: update</p>' : ''; }
function renderGoals() {
  var t = ticks();
  $('#main').innerHTML = staleLine() + GOALS.goals.map(function (g) {
    var d = dueInfo(g), n = g.steps.filter(function (s) { return isDone(g, s, t); }).length;
    var next = (g.steps.find(function (s) { return !isDone(g, s, t); }) || {}).text || 'All steps done ✓';
    return '<a class="row" href="#/goals/' + g.id + '" style="display:block"><div class="t">' + esc(g.id) + ' · ' + esc(g.name) + '</div>' +
      (d.txt ? '<div class="a" style="' + (d.red ? 'color:#d23a2a;font-weight:600' : '') + '">' + esc(d.txt) + '</div>' : '') +
      (g.status ? '<div class="o">' + esc(g.status) + '</div>' : '') +
      '<div class="o"><b>Next:</b> ' + esc(next) + '</div><div class="chips"><span class="chip">' + n + '/' + g.steps.length + ' steps</span>' +
      (g.workshop ? g.workshop.split(',').map(function (w) { return '<span class="chip b">' + esc(w.trim()) + '</span>'; }).join('') : '') +
      (g.library.length ? '<span class="chip g">' + g.library.length + ' from library</span>' : '') + '</div></a>';
  }).join('') + '<p class="note">From Jarvis Goals.md (' + esc(GOALS.goals_updated || GOALS.goals_mtime) + '). Rebuilt on every Egg sync/update — not live.</p>';
}
function renderGoal(id) {
  var g = GOALS.goals.find(function (x) { return x.id === id; });
  if (!g) { $('#main').innerHTML = '<div class="empty">No goal ' + esc(id) + '</div>'; return; }
  var t = ticks(), d = dueInfo(g);
  var next = (g.steps.find(function (s) { return !isDone(g, s, t); }) || {}).text;
  var html = '<div class="item"><a class="back" href="#/goals">‹ Goals</a>' + staleLine() +
    '<div class="t" style="font-size:20px">' + esc(g.name) + '</div>' +
    (d.txt ? '<div class="a" style="' + (d.red ? 'color:#d23a2a;font-weight:600' : '') + '">' + esc(d.txt) + '</div>' : '') +
    (g.why ? '<p class="o" style="-webkit-line-clamp:unset">' + esc(g.why) + '</p>' : '') +
    '<div class="res" style="border-color:var(--acc)"><div class="grp" style="margin:0 0 4px">Do this next</div><div class="t">' + esc(next || 'All steps done ✓') + '</div></div>' +
    '<div class="grp">Steps</div>' + g.steps.map(function (s, i) {
      var on = isDone(g, s, t), local = stepKey(g, s) in t;
      return '<label class="res" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-i="' + i + '"' + (on ? ' checked' : '') + ' style="width:20px;height:20px;margin-top:2px;flex:none"><span style="' + (on ? 'text-decoration:line-through;color:var(--sub)' : '') + '">' + esc(s.text) + (local ? ' <span class="chip">phone</span>' : '') + '</span></label>';
    }).join('') +
    '<button class="btn" id="copyt">Copy ticks for Jarvis</button><p class="note">Ticks here stay on this phone until Jarvis gets them — paste into Jarvis.</p>';
  g.latest.forEach(function (h) {
    html += '<div class="grp">Latest from ' + esc(h.workshop) + '</div><div class="res">' + h.lines.map(function (l) { return '<div class="o" style="-webkit-line-clamp:unset;margin:4px 0">' + esc(l) + '</div>'; }).join('') + '<div class="src">' + esc(h.file) + ' · ' + esc(h.updated || h.mtime) + '</div></div>';
  });
  html += '<div class="grp">From your library</div>' + (g.library.length ? g.library.map(function (p) {
    return '<a class="res" href="#/b/' + p.id + '" style="display:block;text-decoration:none;color:inherit"><div class="src">' + esc(p.id) + ' · ' + esc(p.title) + '</div><div>' + esc(p.text) + '</div>' + (p.label ? '<div class="src"><em>' + esc(p.label) + '</em></div>' : '') + '</a>';
  }).join('') : '<p class="note">Nothing in the library fits this goal yet.</p>') + '</div>';
  $('#main').innerHTML = html;
  window.scrollTo(0, 0);
  document.querySelectorAll('[data-i]').forEach(function (cb) {
    cb.onchange = function () {
      var s = g.steps[+cb.dataset.i], k = stepKey(g, s), t = ticks();
      if (cb.checked === s.done) delete t[k]; else t[k] = cb.checked;
      store('eggTicks', JSON.stringify(t)); renderGoal(id);
    };
  });
  $('#copyt').onclick = function () {
    var t = ticks(), out = [];
    GOALS.goals.forEach(function (gg) { gg.steps.forEach(function (s) { var k = stepKey(gg, s); if (k in t) out.push('- ' + gg.id + ': ' + (t[k] ? '[x] ' : '[ ] (un-ticked) ') + s.text); }); });
    var txt = out.length ? 'Jarvis — goal ticks from the Egg app (' + new Date().toLocaleString() + '):\n' + out.join('\n') : 'Jarvis — no new goal ticks from the Egg app.';
    navigator.clipboard.writeText(txt).then(function () { $('#copyt').textContent = 'Copied ✓ (' + out.length + ')'; });
  };
}

// ---------- routing ----------
function route() {
  var h = location.hash || '#/', tab = h.indexOf('#/find') === 0 ? 'find' : h.indexOf('#/make') === 0 ? 'make' : h.indexOf('#/media') === 0 ? 'media' : h.indexOf('#/goals') === 0 ? 'goals' : 'books';
  document.querySelectorAll('nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.t === tab); });
  var m = h.match(/^#\/b\/(EGG-\d{4})(\/poe)?/);
  $('#ctl').style.display = (tab === 'books' && !m) ? '' : 'none';
  $('#q').style.display = m || tab === 'make' || tab === 'media' || tab === 'goals' ? 'none' : '';
  if (tab === 'goals' && !m) { var gm = h.match(/^#\/goals\/(G\d+)/); return loadGoals(function () { gm ? renderGoal(gm[1]) : renderGoals(); }); }
  $('#q').placeholder = tab === 'find' ? 'Find any book in free sources…' : 'Search title, author, principle…';
  if (m) return renderItem(m[1], !!m[2]);
  if (tab === 'find') { var qq = decodeURIComponent((h.split('?q=')[1] || '')); if (qq) { S.q = qq; $('#q').value = qq; } return renderFind(S.q); }
  if (tab === 'make') { $('#main').innerHTML = '<div class="empty">Make Your Own Book — camera + one mic button + scribble, each capture = a page.<br><br>Coming after Find Books and the link tool.</div>'; return; }
  if (tab === 'media') return renderMedia();
  renderBooks();
}
var qT;
$('#q').addEventListener('input', function () {
  S.q = this.value;
  if ((location.hash || '').indexOf('#/find') === 0) { clearTimeout(qT); qT = setTimeout(function () { renderFind(S.q); }, 450); }
  else renderBooks();
});
['sort', 'group'].forEach(function (k) {
  var seg = $('#' + k);
  seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S[k]); b.onclick = function () { S[k] = b.dataset.v; store(k === 'sort' ? 'eggSort' : 'eggGroup', S[k]); seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); renderBooks(); }; });
});
window.addEventListener('hashchange', route);

async function boot() {
  if (!KEYSTR) { $('#main').innerHTML = '<div class="empty">Egg is private. Open it with your personal link (the one with ?k=…).</div>'; return; }
  try {
    var buf = await getBin('data/index.bin', async function (fresh) { var d = await unseal(fresh); DB = d; $('#built').textContent = 'updated ' + d.built; route(); });
    DB = await unseal(buf);
    $('#built').textContent = DB.items.length + ' items';
    route();
    var ms = Math.round(performance.now() - T0), nav = performance.getEntriesByType('navigation')[0];
    window.EGG_TIMING = { scriptToList: ms, navStartToList: Math.round(performance.now()) };
    console.log('[Egg] list on screen', window.EGG_TIMING);
  } catch (e) {
    $('#main').innerHTML = '<div class="empty">Couldn’t open Egg: ' + esc(e.message) + '<br>Wrong or old link? Ask Egg on the Mac for the current one.</div>';
  }
  if ('serviceWorker' in navigator) {
    var hadSW = !!navigator.serviceWorker.controller;
    // a new app version took over (sw.js changed): reload once so the new page shows right away
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW && !window._eggReloaded) { window._eggReloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}
boot();
</script>
